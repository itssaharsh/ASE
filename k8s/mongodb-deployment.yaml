apiVersion: apps/v1
kind: Deployment
metadata:
  name: crisis-mongodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app: crisis-mongodb
  template:
    metadata:
      labels:
        app: crisis-mongodb
    spec:
      containers:
      - name: mongodb
        image: mongo:6.0
        ports:
        - containerPort: 27017
        volumeMounts:
        - name: mongo-data
          mountPath: /data/db
      volumes:
      - name: mongo-data
        emptyDir: {}  # Replace with PersistentVolumeClaim for production
---
apiVersion: v1
kind: Service
metadata:
  name: crisis-mongodb
spec:
  selector:
    app: crisis-mongodb
  ports:
  - port: 27017
    targetPort: 27017
