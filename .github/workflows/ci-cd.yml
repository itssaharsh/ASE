name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
    - name: Install dependencies
      run: |
        cd backend
        pip install -r requirements.txt
        pip install pytest httpx
    - name: Run Tests
      run: |
        # echo "Running backend tests..."
        # cd backend && pytest

  build-and-push:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
    - uses: actions/checkout@v3
    
    - name: Login to DockerHub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
        
    - name: Build and Push Backend
      run: |
        docker build -t your-registry/crisis-backend:${{ github.sha }} ./backend
        docker push your-registry/crisis-backend:${{ github.sha }}
        
    - name: Build and Push Frontend
      run: |
        docker build -t your-registry/crisis-frontend:${{ github.sha }} ./frontend
        docker push your-registry/crisis-frontend:${{ github.sha }}
