version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: crisis-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: crisis-backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - DATABASE_NAME=crisis_monitoring
      - NEWS_API_KEY=${NEWS_API_KEY:-YOUR_NEWS_API_KEY}
    depends_on:
      - mongodb

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: crisis-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo-data:
